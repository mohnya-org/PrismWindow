name: Release macOS App

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Optional stable version without v (e.g. 1.5.0). Omit to increment the latest patch."
        required: false
      validate_only:
        description: "Validate signing and notarization without creating tags or publishing a release"
        type: boolean
        default: false

concurrency:
  group: release-macos-app
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  prepare-release:
    if: github.repository == 'mohnya-org/PrismWindow' && (github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only))
    runs-on:
      - self-hosted
      - macOS
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      should_release: ${{ steps.metadata.outputs.should_release }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Test release version selection and publication
        run: |
          python3 -B scripts/test-release-version.py
          python3 -B scripts/test-publish-release.py
          python3 -B scripts/test-macos-dmg.py
          python3 -B scripts/test-keychain-lock.py
          python3 -B scripts/test-macos-distribution.py

      - name: Resolve release metadata
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: python3 scripts/release-version.py

      - name: Validate release secrets before building
        if: steps.metadata.outputs.should_release == 'true' || inputs.validate_only
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: python3 -B scripts/macos-distribution.py preflight

      - name: Report already published commit
        if: steps.metadata.outputs.should_release != 'true' && !inputs.validate_only
        run: echo "This commit already has a published stable release."

  release:
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true' || inputs.validate_only
    runs-on:
      - self-hosted
      - macOS
    env:
      VERSION: ${{ needs.prepare-release.outputs.version }}
      TAG: ${{ needs.prepare-release.outputs.tag }}
    steps:
      - name: Check out triggering commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set archive paths
        run: |
          {
            echo "ZIP_PATH=$GITHUB_WORKSPACE/dist/PrismWindow-$VERSION-macOS.zip"
            echo "DMG_PATH=$GITHUB_WORKSPACE/dist/PrismWindow-$VERSION-macOS.dmg"
            echo "CHECKSUM_PATH=$GITHUB_WORKSPACE/dist/PrismWindow-$VERSION-macOS.zip.sha256"
          } >> "$GITHUB_ENV"

      - name: Validate release secrets before building
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: python3 -B scripts/macos-distribution.py preflight

      - name: Build app bundle
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_FEED_URL: https://github.com/mohnya-org/PrismWindow/releases/latest/download/appcast.xml
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$VERSION" BUILD_NUMBER="${GITHUB_RUN_NUMBER}" SIGNING_MODE=unsigned ./scripts/build-app.sh
          rm -rf "dist/Prism Window.app"
          ditto --norsrc --noextattr ".build/release/Prism Window.app" "dist/Prism Window.app"

      - name: Verify packaged release version
        run: |
          set -euo pipefail
          PLIST="dist/Prism Window.app/Contents/Info.plist"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" == "$VERSION" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" == "$GITHUB_RUN_NUMBER" ]]

      - name: Test update configuration
        run: bash scripts/test-update-configuration.sh

      - name: Verify app architecture
        run: |
          set -euo pipefail
          APP_BINARY="dist/Prism Window.app/Contents/MacOS/PrismWindow"
          ARCH_INFO="$(file "$APP_BINARY")"
          echo "$ARCH_INFO"
          echo "$ARCH_INFO" | grep -q "arm64"

      - name: Sign, notarize, staple and validate final ZIP
        timeout-minutes: 35
        env:
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: python3 -B scripts/macos-distribution.py release "dist/Prism Window.app" "$ZIP_PATH"

      - name: Hash final verified archive
        run: shasum -a 256 "$ZIP_PATH" > "$CHECKSUM_PATH"

      - name: Generate signed Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_BIN: .build/artifacts/sparkle/Sparkle/bin
        run: bash scripts/generate-appcast.sh

      - name: Recheck final assets before publication
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          shasum -a 256 -c "$CHECKSUM_PATH"
          python3 -B scripts/macos-distribution.py verify-archive "$ZIP_PATH"

      - name: Create signed and notarized first-install DMG
        timeout-minutes: 35
        env:
          APPLE_CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: python3 -B scripts/macos-dmg.py create "dist/Prism Window.app" "$DMG_PATH"

      - name: Keep validated installers for verification runs
        if: inputs.validate_only
        uses: actions/upload-artifact@v4
        with:
          name: PrismWindow-validated-distribution
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          retention-days: 7

      - name: Publish complete GitHub Release
        if: github.ref == 'refs/heads/main' && !inputs.validate_only
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-release.sh

      - name: Cleanup isolated signing material
        if: always()
        run: |
          if [[ -n "${SIGNING_TEMP_DIR:-}" ]]; then
            python3 -B scripts/macos-distribution.py cleanup "$SIGNING_TEMP_DIR"
          fi

      - name: Cleanup DMG signing material
        if: always()
        run: |
          if [[ -n "${DMG_SIGNING_TEMP_DIR:-}" ]]; then
            python3 -B scripts/macos-dmg.py cleanup "$DMG_SIGNING_TEMP_DIR"
          fi
